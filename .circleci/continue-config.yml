version: 2.1

orbs:
  compliance: anyvan/compliance@1
  ci: anyvan/ci@1
  aws: anyvan/aws_auth_config@2
  terraform-helper: anyvan/terraform-helper@1
  node: circleci/node@5.1.0
  aws-ecr: circleci/aws-ecr@9.0
  aws-cli: circleci/aws-cli@3.1

parameters:
  region:
    default: eu-west-1
    type: string
  modules:
    default: v0.0.79
    type: string
  destroy:
    default: false
    type: boolean
  terraform_version:
    default: "1.9.5"
    type: string
  jira_ticket_number:
    type: string
    default: $(echo $CIRCLE_BRANCH | sed -ne 's/[A-Z]*-\([0-9]*\)-.*/\1/p')
  image_tag:
    type: string
    default: $CIRCLE_SHA1
  workflow:
    default: "default"
    type: string
    description: "Specify which workflow to run"
  run-continue-workflow:
    type: boolean
    default: false

executors:
  base:
    docker:
      - image: cimg/base:current

  node-docker:
    docker:
      - image: cimg/node:20.19.2
    resource_class: small

  iac-base:
    docker:
      - image: $AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/base/iac-base:noble
        aws_auth:
          oidc_role_arn: arn:aws:iam::$HORIZONTAL_ACCOUNT:role/circleci_oidc_role
  nodejs:
    docker:
      - image: $AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/base/node-js-twilio:20-noble
        aws_auth:
          oidc_role_arn: arn:aws:iam::$HORIZONTAL_ACCOUNT:role/circleci_oidc_role

commands:
  determine-environment:
    steps:
      - run:
          name: Determine deployment environment
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ] || [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "prod" > /tmp/deployment_env
            else
              echo "stage" > /tmp/deployment_env
            fi
      - persist_to_workspace:
          root: /tmp
          paths:
            - deployment_env

  build-and-push:
    parameters:
      image:
        type: string
      env:
        type: string
      project-root:
        type: string
      repository:
        type: string
      entry:
        type: string
      dockerfile:
        type: string
      ecr_app_host:
        type: string
        default: $AWS_ECR_APP_IMAGES_REPOSITORY_HOST
    steps:
      - run:
          name: "Build and push image to ECR"
          command: |
            PROJECT_REPOSITORY_URL=<< parameters.ecr_app_host >>/twilio-webchat-widget/<<parameters.env>>/<< parameters.repository >>
            PROJECT_REPOSITORY_HOST=<< parameters.ecr_app_host >>
            aws ecr get-login-password | docker login --username AWS --password-stdin $PROJECT_REPOSITORY_HOST
            cd << parameters.project-root >>

            docker build -f << parameters.dockerfile >> -t << parameters.image >>-latest \
              << parameters.entry >>

            docker tag << parameters.image >>-latest $PROJECT_REPOSITORY_URL:<< parameters.image >>-latest
            docker tag << parameters.image >>-latest $PROJECT_REPOSITORY_URL:<< parameters.image >>-$CIRCLE_SHA1
            docker push $PROJECT_REPOSITORY_URL:<< parameters.image >>-latest
            docker push $PROJECT_REPOSITORY_URL:<< parameters.image >>-$CIRCLE_SHA1

jobs:
  determine_environment:
    executor: base
    steps:
      - determine-environment

  build-image:
    parameters:
      image:
        type: string
      project-root:
        type: string
      env:
        type: string
      repository:
        type: string
      entry:
        type: string
      dockerfile:
        type: string
    executor: iac-base
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - setup_remote_docker:
          docker_layer_caching: false
          version: default
      - run:
          name: Set environment variable
          command: |
            ENV=$(cat /tmp/deployment_env)
            echo "export DEPLOYMENT_ENV=$ENV" >> $BASH_ENV
      - build-and-push:
          image: << parameters.image >>
          env: $DEPLOYMENT_ENV
          project-root: << parameters.project-root >>
          repository: << parameters.repository >>
          entry: << parameters.entry >>
          dockerfile: << parameters.dockerfile >>

  approve_deployment:
    executor: base
    steps:
      - run:
          name: Manual approval placeholder
          command: echo "Deployment approved"

workflows:
  # Webchat Widget Deployment Workflow
  deploy_webchat_widget:
    when:
      and:
        - << pipeline.parameters.run-continue-workflow >>
        - equal: ["deploy_webchat_widget", << pipeline.parameters.workflow >>]
    jobs:
      - determine_environment
      - approve_deployment:
          type: approval
          name: approve_webchat_widget_deployment
      - aws/init:
          name: "Log in to AWS"
          context: anyvan
          region: << pipeline.parameters.region >>
          account: PRODUCTION HORIZONTAL TEST1
          requires:
            - approve_webchat_widget_deployment
            - determine_environment
      
      # Build Server Image
      - build-image:
          name: build_webchat_server
          project-root: .
          entry: .
          repository: server
          image: twilio-webchat-server
          dockerfile: Dockerfile.server
          requires:
            - "Log in to AWS"
      
      # Build Client Image
      - build-image:
          name: build_webchat_client
          project-root: .
          entry: .
          repository: client
          image: twilio-webchat-client
          dockerfile: Dockerfile.client
          requires:
            - "Log in to AWS"
      
      # Plan Terraform for Production
      - terraform-helper/plan:
          name: plan_webchat_widget_prod
          context:
            - anyvan
            - twilio-flex-prod
          workspace: production-twilio-webchat-widget
          var: >-
            jira_ticket_number=<< pipeline.parameters.jira_ticket_number >>,
            server_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/prod/server:twilio-webchat-server-<< pipeline.parameters.image_tag >>,
            client_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/prod/client:twilio-webchat-client-<< pipeline.parameters.image_tag >>,
            git_sha=$CIRCLE_SHA1,
            terraform_version=<< pipeline.parameters.terraform_version >>,
            slack_channel_web_hook=$LIONS_ALERTS_CHANNEL_WEBHOOK
          var_file: env/production.tfvars
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          settings: |-
            {
              "datadog_api_key": "${DD_API_KEY}"
            }
          requires:
            - build_webchat_server
            - build_webchat_client
          filters:
            branches:
              only: master
      
      # Plan Terraform for Staging
      - terraform-helper/plan:
          name: plan_webchat_widget_staging
          context:
            - anyvan
            - twilio-flex-stage
          workspace: staging-twilio-webchat-widget
          var: >-
            server_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/stage/server:twilio-webchat-server-<< pipeline.parameters.image_tag >>,
            client_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/stage/client:twilio-webchat-client-<< pipeline.parameters.image_tag >>,
            git_sha=$CIRCLE_SHA1,
            terraform_version=<< pipeline.parameters.terraform_version >>
          var_file: env/staging.tfvars
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          requires:
            - build_webchat_server
            - build_webchat_client
          filters:
            branches:
              ignore: master
      
      # Approve Terraform Apply
      - approve_deployment:
          name: approve_terraform_apply
          type: approval
          requires:
            - plan_webchat_widget_prod
            - plan_webchat_widget_staging
      
      # Apply Terraform for Production
      - terraform-helper/apply:
          name: apply_webchat_widget_prod
          context: anyvan
          workspace: production-twilio-webchat-widget
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          requires:
            - approve_terraform_apply
          filters:
            branches:
              only: master
      
      # Apply Terraform for Staging
      - terraform-helper/apply:
          name: apply_webchat_widget_staging
          context: anyvan
          workspace: staging-twilio-webchat-widget
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          requires:
            - approve_terraform_apply
          filters:
            branches:
              ignore: master

  # PR Environment Deployment Workflow
  deploy_to_pr_env:
    when:
      and:
        - equal: ["deploy_to_pr_env", << pipeline.parameters.workflow >>]
        - not:
            equal: ["main", << pipeline.git.branch >>]
        - not:
            equal: ["", << pipeline.parameters.jira_ticket_number >>]
    jobs:
      - aws/init:
          name: "Log in to AWS"
          context: anyvan
          region: << pipeline.parameters.region >>
          account: PRODUCTION HORIZONTAL TEST1
      
      # Build Server Image for PR Environment
      - build-image:
          name: build_webchat_server_pr
          project-root: .
          entry: .
          repository: server
          image: twilio-webchat-server
          dockerfile: Dockerfile.server
          requires:
            - "Log in to AWS"
      
      # Build Client Image for PR Environment
      - build-image:
          name: build_webchat_client_pr
          project-root: .
          entry: .
          repository: client
          image: twilio-webchat-client
          dockerfile: Dockerfile.client
          requires:
            - "Log in to AWS"
      
      # Plan Terraform for PR Environment
      - terraform-helper/plan:
          name: plan_webchat_widget_pr
          context:
            - anyvan
            - twilio-flex-stage
          workspace: testing-twilio-webchat-widget-<< pipeline.parameters.jira_ticket_number >>
          var: >-
            jira_ticket_number=<< pipeline.parameters.jira_ticket_number >>,
            server_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/testing/server:twilio-webchat-server-<< pipeline.parameters.image_tag >>,
            client_container_image_url=$AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/twilio-webchat-widget/testing/client:twilio-webchat-client-<< pipeline.parameters.image_tag >>,
            git_sha=$CIRCLE_SHA1,
            terraform_version=<< pipeline.parameters.terraform_version >>
          var_file: env/testing.tfvars
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          requires:
            - build_webchat_server_pr
            - build_webchat_client_pr
      
      # Apply Terraform for PR Environment
      - terraform-helper/apply:
          name: apply_webchat_widget_pr
          context: anyvan
          workspace: testing-twilio-webchat-widget-<< pipeline.parameters.jira_ticket_number >>
          modules_branch: << pipeline.parameters.modules >>
          path: terraform/
          terraform_version: << pipeline.parameters.terraform_version >>
          requires:
            - plan_webchat_widget_pr

  scheduled:
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only: master
    jobs:
      - compliance/verify:
          context: anyvan
      - ci/cancel_workflows:
          context: anyvan
          timeout: 3d 