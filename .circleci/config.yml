version: "2.1"

setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.3
  compliance: anyvan/compliance@1
  ci: anyvan/ci@1

parameters:
  workflow:
    type: enum
    enum: [
      "default",
      "deploy_webchat_widget",
      "deploy_to_pr_env"
    ]
    default: "default"
    description: "Select which service to deploy"

executors:
  node-docker:
    docker:
      - image: cimg/node:20.19.2
    resource_class: small

jobs:
  format-and-lint-check:
    executor: node-docker
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            npm ci
      - run:
          name: Run format check
          command: |
            npm run format:check


workflows:
  setup:
    when:
      equal: ["default", << pipeline.parameters.workflow >>]
    jobs:
      - compliance/verify:
          context: anyvan
      - format-and-lint-check
      - path-filtering/filter:
          name: "Setup deployment workflow"
          base-revision: master
          config-path: .circleci/continue-config.yml
          mapping: |
            .* run-continue-workflow true
          requires:
            - format-and-lint-check

  deploy-workflow:
    when:
      not:
        equal: ["default", << pipeline.parameters.workflow >>]
    jobs:
      - path-filtering/filter:
          name: "Setup deployment workflow"
          base-revision: master
          config-path: .circleci/continue-config.yml
          mapping: |
            .* run-continue-workflow true
