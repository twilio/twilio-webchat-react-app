version: "2.1"

orbs:
  compliance: anyvan/compliance@1
  ci: anyvan/ci@1
  aws: anyvan/aws_auth_config@2
  terraform-helper: anyvan/terraform-helper@1
  node: circleci/node@5.1.0
  aws-ecr: circleci/aws-ecr@9.0
  aws-cli: circleci/aws-cli@3.1

parameters:
  region:
    default: eu-west-1
    type: string
  modules:
    default: v0.0.79
    type: string
  terraform_version:
    default: "1.9.5"
    type: string
  jira_ticket_number:
    type: string
    default: $(echo $CIRCLE_BRANCH | sed -ne 's/[A-Z]*-\([0-9]*\)-.*/\1/p')
  image_tag:
    type: string
    default: $CIRCLE_SHA1

executors:
  base:
    docker:
      - image: cimg/base:current

  node-docker:
    docker:
      - image: cimg/node:20.19.2
    resource_class: small

  iac-base:
    docker:
      - image: $AWS_ECR_CIRCLECI_IMAGES_REPOSITORY_HOST/base/iac-base:noble
        aws_auth:
          oidc_role_arn: arn:aws:iam::$HORIZONTAL_ACCOUNT:role/circleci_oidc_role

commands:
  build-and-push:
    parameters:
      image:
        type: string
      env:
        type: string
      project-root:
        type: string
      repository:
        type: string
      entry:
        type: string
      dockerfile:
        type: string
      ecr_app_host:
        type: string
        default: $AWS_ECR_APP_IMAGES_REPOSITORY_HOST
    steps:
      - run:
          name: "Build and push image to ECR"
          command: |
            PROJECT_REPOSITORY_URL=<< parameters.ecr_app_host >>/twilio-webchat-widget/<<parameters.env>>/<< parameters.repository >>
            PROJECT_REPOSITORY_HOST=<< parameters.ecr_app_host >>
            aws ecr get-login-password | docker login --username AWS --password-stdin $PROJECT_REPOSITORY_HOST
            cd << parameters.project-root >>

            docker build -f << parameters.dockerfile >> -t << parameters.image >>-latest \
              << parameters.entry >>

            docker tag << parameters.image >>-latest $PROJECT_REPOSITORY_URL:<< parameters.image >>-latest
            docker tag << parameters.image >>-latest $PROJECT_REPOSITORY_URL:<< parameters.image >>-$CIRCLE_SHA1
            docker push $PROJECT_REPOSITORY_URL:<< parameters.image >>-latest
            docker push $PROJECT_REPOSITORY_URL:<< parameters.image >>-$CIRCLE_SHA1

jobs:
   build-image:
    parameters:
      image:
        type: string
      project-root:
        type: string
      env:
        type: string
      repository:
        type: string
      entry:
        type: string
      dockerfile:
        type: string
    executor: iac-base
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
          version: default
      - build-and-push:
          image: << parameters.image >>
          env: << parameters.env >>
          project-root: << parameters.project-root >>
          repository: << parameters.repository >>
          entry: << parameters.entry >>
          dockerfile: << parameters.dockerfile >>

workflows:
  # Default workflow - Deploy to PR Environment
  deploy_to_pr_env:
    when:
      and:
        - not:
            equal: ["main", << pipeline.git.branch >>]
        - not:
            equal: ["", << pipeline.parameters.jira_ticket_number >>]
    jobs:
      - aws/init: &aws_init
          name: "Log in to AWS"
          context: anyvan
          region: << pipeline.parameters.aws_region >>
          account: HORIZONTAL PRODUCTION TEST1
          persist: .aws
      - login-codeartifact-registry:
          name: "Log in to AWS CodeArtifact"
          requires:
            - "Log in to AWS"
      - aws-ecr-helper/create_aws_ecr: &create_ecr
          name: "Create AWS ECR repository"
          context: anyvan
          module_path: "iac/terraform/image_repository"
          app_name: << pipeline.parameters.app_name >>
          tf_version: << pipeline.parameters.terraform_version >>
          requires:
            - "Log in to AWS"
      - aws-ecr-helper/ecr_login: &ecr_login
          name: "Log in to AWS ECR"
          context: anyvan
          requires:
            - "Create AWS ECR repository"
      
      # Build Server Image for PR Environment
      - build-image:
          name: build_webchat_server_pr
          project-root: .
          entry: .
          repository: server
          image: twilio-webchat-server
          dockerfile: Dockerfile.server
          env: testing
          requires:
            - "Log in to AWS"
      
      # Build Client Image for PR Environment
      - build-image:
          name: build_webchat_client_pr
          project-root: .
          entry: .
          repository: client
          image: twilio-webchat-client
          dockerfile: Dockerfile.client
          env: testing
          requires:
            - "Log in to AWS"
      
     - terraform-helper/plan:
        <<: *plan
        name: "TF Plan for PR"
        env: branches
        expire: true
        var_file: env/branches.tfvars
        workspace: << pipeline.parameters.app_name >>_branches<< pipeline.parameters.jira_ticket_number >>
        requires:
          - build-and-push
    - terraform-helper/apply:
        <<: *apply
        name: "Apply TF plan for PR"
        expire: true
        workspace: << pipeline.parameters.app_name >>_branches<< pipeline.parameters.jira_ticket_number >>
        requires:
          - "TF Plan for PR"

pull_request_closed:
  when:
    and:
      - equal: [pull_request_closed, << pipeline.parameters.workflow >>]
      - not:
          equal: [main, << pipeline.git.branch >>]
      - not:
          equal: ["", << pipeline.parameters.jira_ticket_number >>]
  jobs:
    - aws/init:
        *aws_init
    - terraform-helper/plan:
        <<: *plan
        name: "Plan destroy PR environment"
        env: branches
        destroy: true
        var_file: env/branches.tfvars
        workspace: << pipeline.parameters.app_name >>_branches<< pipeline.parameters.jira_ticket_number >>
        requires:
          - "Log in to AWS"
    - terraform-helper/apply:
        <<: *apply
        name: "Apply Destroy of PR environment"
        destroy: true
        workspace: << pipeline.parameters.app_name >>_branches<< pipeline.parameters.jira_ticket_number >>
        requires:
          - "Plan destroy PR environment"









