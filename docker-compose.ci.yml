services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CI=true
      - LC_ALL=en_GB.UTF-8
      # Keep Cypress' binary cache inside the checkout (bind-mounted above) rather than
      # the container's default $HOME/.cache/Cypress, so the cache-v2 plugin's
      # "cypress/cache" path actually persists something across builds.
      - CYPRESS_CACHE_FOLDER=/app/cypress/cache
